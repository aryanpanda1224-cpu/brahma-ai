<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRAHMA AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #05070d;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 92%;
      max-width: 500px;
      text-align: center;
    }

    .core {
      width: 170px;
      height: 170px;
      margin: 0 auto 30px;
      border: 3px solid #00eaff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00eaff;
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 4px;
      box-shadow:
        0 0 20px #00eaff,
        0 0 50px rgba(0, 234, 255, 0.4);
    }

    h1 {
      margin: 0;
      font-size: 44px;
      letter-spacing: 8px;
    }

    .subtitle {
      color: #8d98a7;
      margin: 12px 0 35px;
      font-size: 15px;
    }

    .chat-box {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px 18px;
      border-radius: 30px;
      border: 1px solid #263442;
      background: #0d111a;
      color: white;
      outline: none;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 0 20px;
      background: #00eaff;
      color: #001014;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      margin-top: 22px;
      color: #00eaff;
      font-size: 12px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="core">B</div>

    <h1>BRAHMA</h1>

    <div class="subtitle">
      YOUR PERSONAL AI ASSISTANT
    </div>

<div class="chat-box">
  <input id="userInput" type="text" placeholder="Ask BRAHMA anything...">
  <button onclick="startListening()">🎤</button>
  <button onclick="talkToBrahma()">Send</button>
</div>

<div id="response" style="margin-top: 20px; color: #00eaff;"></div>

<script>
  function talkToBrahma() {
  const input = document.getElementById("userInput");
  const response = document.getElementById("response");

  const message = input.value.trim();

  if (message === "") {
    response.textContent = "BRAHMA: Please type something.";
    speak("Please type something.");
    return;
  }

  const lowerMessage = message.toLowerCase();
  let reply;

  // Remember name
  if (lowerMessage.includes("my name is ")) {
    const name = message.substring(lowerMessage.indexOf("my name is ") + 11).trim();

    saveMemory("name", name);

    reply = "Got it. I will remember your name is " + name + ".";
  }

  // Recall name
  else if (
    lowerMessage.includes("what is my name") ||
    lowerMessage.includes("do you know my name")
  ) {
    const name = getMemory("name");

    if (name) {
      reply = "Your name is " + name + ".";
    } else {
      reply = "You haven't told me your name yet.";
    }
  }
// Clock
else if (
  lowerMessage.includes("what time is it") ||
  lowerMessage.includes("current time") ||
  lowerMessage.includes("time")
) {
  const now = new Date();
  reply = "The current time is " + now.toLocaleTimeString();
}

// Date
else if (
  lowerMessage.includes("what is today's date") ||
  lowerMessage.includes("what is the date") ||
  lowerMessage.includes("today's date")
) {
  const now = new Date();
  reply = "Today's date is " + now.toLocaleDateString();
  }
// Calculator
else if (
  lowerMessage.startsWith("calculate ") ||
  lowerMessage.startsWith("what is ") ||
  lowerMessage.startsWith("multiply ") ||
  lowerMessage.startsWith("divide ") ||
  lowerMessage.startsWith("add ") ||
  lowerMessage.startsWith("subtract ")
) {
  let expression = message
    .replace(/^calculate /i, "")
    .replace(/^what is /i, "")
    .replace(/^multiply /i, "")
    .replace(/^divide /i, "")
    .replace(/^add /i, "")
    .replace(/^subtract /i, "")
    .replace(/ times /gi, " * ")
    .replace(/ multiplied by /gi, " * ")
    .replace(/ divided by /gi, " / ")
    .replace(/ plus /gi, " + ")
    .replace(/ minus /gi, " - ")
    .trim();

  try {
    const answer = Function('"use strict"; return (' + expression + ')')();
    reply = "The answer is " + answer + ".";
  } catch {
    reply = "Sorry, I couldn't calculate that.";
  }
    }
  // Existing responses
  else if (
    lowerMessage.includes("hello") ||
    lowerMessage.includes("hi")
  ) {
    reply = "Hello! I am BRAHMA. How can I help you?";
  }

  else if (lowerMessage.includes("how are you")) {
    reply = "I am doing great and I am ready to help you.";
  }

  else if (lowerMessage.includes("who are you")) {
    reply = "I am BRAHMA, your personal AI assistant.";
  }

  else {
    reply = "I understand your message. I am still learning.";
  }

  response.textContent = "BRAHMA: " + reply;
  speak(reply);

  input.value = "";
  }
function speak(text) {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();

    const voices = window.speechSynthesis.getVoices();

    let voice = voices.find(v =>
      v.lang.startsWith("en") &&
      /male|david|mark|daniel|alex/i.test(v.name)
    );

    if (!voice) {
      voice = voices.find(v => v.lang.startsWith("en"));
    }

    const speech = new SpeechSynthesisUtterance(text);

    if (voice) {
      speech.voice = voice;
    }

    speech.rate = 0.9;
    speech.pitch = 0.65;
    speech.volume = 1;

    window.speechSynthesis.speak(speech);
  }
  }
  function startListening() {
  if (!("webkitSpeechRecognition" in window) && !("SpeechRecognition" in window)) {
    response.textContent = "BRAHMA: Voice input is not supported in this browser.";
    speak("Voice input is not supported in this browser.");
    return;
  }

  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  const recognition = new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  response.textContent = "BRAHMA: Listening...";

  recognition.start();

  recognition.onresult = function(event) {
    const spokenText = event.results[0][0].transcript;

    document.getElementById("userInput").value = spokenText;

    talkToBrahma();
  };

  recognition.onerror = function() {
    response.textContent = "BRAHMA: I couldn't hear you. Please try again.";
  };
  }
  // BRAHMA Local Memory
let brahmaMemory = JSON.parse(localStorage.getItem("brahmaMemory")) || {};

function saveMemory(key, value) {
  brahmaMemory[key] = value;
  localStorage.setItem("brahmaMemory", JSON.stringify(brahmaMemory));
}

function getMemory(key) {
  return brahmaMemory[key];
      }                                                
</script>
    
    <div class="status">
      SYSTEM ONLINE
    </div>

  </div>

</body>
  </html>
