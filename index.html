<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRAHMA AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #05070d;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 92%;
      max-width: 500px;
      text-align: center;
    }

    .core {
      width: 170px;
      height: 170px;
      margin: 0 auto 30px;
      border: 3px solid #00eaff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00eaff;
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 4px;
      box-shadow:
        0 0 20px #00eaff,
        0 0 50px rgba(0, 234, 255, 0.4);
    }

    h1 {
      margin: 0;
      font-size: 44px;
      letter-spacing: 8px;
    }

    .subtitle {
      color: #8d98a7;
      margin: 12px 0 35px;
      font-size: 15px;
    }

    .chat-box {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px 18px;
      border-radius: 30px;
      border: 1px solid #263442;
      background: #0d111a;
      color: white;
      outline: none;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 0 20px;
      background: #00eaff;
      color: #001014;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      margin-top: 22px;
      color: #00eaff;
      font-size: 12px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="core">B</div>

    <h1>BRAHMA</h1>

    <div class="subtitle">
      YOUR PERSONAL AI ASSISTANT
    </div>

    <div class="chat-box">
      <input type="text" placeholder="Ask BRAHMA anything...">
      <button>Send</button>
    </div>

    <div class="status">
      SYSTEM ONLINE
    </div>

  </div>

</body>
  </html>
